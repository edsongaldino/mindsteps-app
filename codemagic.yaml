workflows:
  mobile-release:
    name: MindSteps iOS e Android

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      groups:
        - mindsteps
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.mindsteps.app

      android_signing:
        - MINDSTEPS_ANDROID_KEYSTORE

    scripts:
      - name: Decodificar arquivos do Firebase
        script: |
          echo $GOOGLE_SERVICES_JSON | base64 --decode > android/app/google-services.json
          echo $GOOGLE_SERVICE_INFO | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Limpar e baixar dependencias
        script: |
          flutter clean
          flutter pub get
      - name: Configurar perfis do iOS
        script: |
          xcode-project use-profiles
      - name: Buildar iOS
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
      - name: Buildar Android
        script: |
          flutter build appbundle --release

    artifacts:
      - build/ios/ipa/*.ipa
      - build/app/outputs/bundle/release/*.aab
      - /tmp/xcodebuild_logs/*.log

    integrations:
      app_store_connect: Codemagic

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true